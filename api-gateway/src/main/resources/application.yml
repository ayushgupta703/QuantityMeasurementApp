spring:
  codec:
    max-in-memory-size: 10MB

  cloud:
    loadbalancer:
      ribbon:
        enabled: false

    gateway:

      # ✅ GLOBAL FILTERS (IMPORTANT)
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      routes:

        # 🔐 AUTH SERVICE (REGISTER + LOGIN)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - name: Retry
              args:
                retries: 3

        # 🔐 OAUTH ROUTES (DO NOT STRIP)
        - id: auth-oauth
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**, /login/**

        # ⚙️ MEASUREMENT SERVICE
        - id: measurement-service
          uri: lb://measurement-service
          predicates:
            - Path=/api/**

