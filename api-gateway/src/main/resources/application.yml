spring:
  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**
          filters:
            - PreserveHostHeader

        - id: auth-oauth
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/oauth2/**, /login/**
          filters:
            - PreserveHostHeader

        - id: measurement-service
          uri: lb://MEASUREMENT-SERVICE
          predicates:
            - Path=/api/**
          filters:
            - PreserveHostHeader